<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanning a Room</title>
<meta name="description" content="Replay of a live 3D scan of a room, made with a phone in real time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./">&larr; All three replays</a>
    <h1>How fast a room is scanned</h1>
  </header>


  <section class="bench" aria-label="Replay">
    <div class="map">
      <div class="stage">
        <canvas id="map" aria-label="3D view of the room scan growing in its photo colours, with the phone's track; drag to turn, scroll or pinch to zoom"></canvas>
        <div class="loading" id="loading">Loading the scan</div>
      </div>
      <div class="legend">
        <span>Scan in its photo colours</span>
        <span><i class="sw" style="background:#ff2bd6"></i>Phone and camera view</span>
        <span><i class="sw" style="background:#ffe600"></i>Track</span>
        <button id="view-reset" type="button">Reset view</button>
      </div>
    </div>
    <div class="side">
      <div class="cam"><img id="cam" alt="The phone's camera photo at this moment"><video id="camv" muted playsinline preload="auto" hidden></video><span class="cap">Camera</span></div>
      <div class="phos"><div class="view"><video id="phos" muted playsinline preload="auto"></video><span class="cap">Phosphenes</span></div><div class="modes" id="phos-modes" aria-label="What the phosphenes show"></div></div>
      <div class="readout" aria-live="off">
        <div><span>Time</span><b id="r-t">0.0 s</b></div>
        <div><span>Scan so far</span><b id="r-n">0 dots</b></div>
        <div><span>Walked</span><b id="r-d">0.0 m</b></div>
        <div><span>Phone height</span><b id="r-h">-</b></div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="follow"> Follow the phone</label>
        <label><input type="checkbox" id="final"> Show the finished scan underneath</label>
      </div>
    </div>
  </section>

  <div class="transport">
    <button id="play" type="button">Play</button>
    <select id="rate" aria-label="Playback speed">
      <option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option>
    </select>
    <div class="scrub"><div class="ticks" id="ticks"></div><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position in the scan"></div>
    <span class="clock" id="clock">0.0 / 0.0 s</span>
  </div>
  <nav class="next" aria-label="Other replays"><a href="navigation.html">2. Navigation line during the scan &rarr;</a><a href="moving.html">3. Moving objects &rarr;</a></nav>
</div>

<script>
window.PAGE = {
  start: 0, line: false, autoplay: true,
  camVideo: "data/cam/nav.mp4",
  phos: { src: "data/phos/nav", v: 1, modes: [["edges", "Edges"], ["semantic", "Objects"], ["obstacles", "Obstacles"], ["floor_checker", "Floor"]] }
};
</script>
<script src="data/room.js?v=15"></script>
<script type="importmap">{"imports": {"three": "./vendor/three.module.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"}}</script>
<script type="module" src="viewer.js?v=15"></script>
</body>
</html>
