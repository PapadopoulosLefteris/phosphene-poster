<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moving Objects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="replay">
  <canvas id="map" aria-label="3D scan replay, drag to turn, pinch or scroll to zoom"></canvas>
  <div id="loading" role="status" aria-label="Loading"></div>
  <div class="top">
    <a class="icon" href="./" aria-label="Back to all scans"><svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12 14 3.2z"/></svg></a>
    <button id="view-reset" type="button" aria-label="Reset view"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
  </div>
  <img id="cam" alt="">
  <div class="bar">
    <button id="play" class="paused" type="button" aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
    </button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">
  </div>
</main>
<script>window.PAGE = { start: 10.5, line: false, view: "phone" };</script>
<script src="data/moving.js"></script>
<script type="importmap">{"imports": {"three": "./vendor/three.module.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"}}</script>
<script type="module" src="viewer.js"></script>
</body>
</html>
